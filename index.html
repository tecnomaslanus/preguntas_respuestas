<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecnomas - Respuestas Rápidas</title>
  
  <!-- Google Fonts: Oswald y Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-yellow: #ffcb03;
      --primary-purple: #5d2783;
      --purple-hover: #4a1f6a;
      --yellow-hover: #e0b300;
      --bg-dark: #121216;
      --card-bg: #1a1a22;
      --input-bg: #242430;
      --border-color: #2e2e3e;
      --text-main: #f0f0f5;
      --text-muted: #a0a0b2;
      --font-title: 'Oswald', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    /* Header & Branding */
    header {
      background: linear-gradient(135deg, var(--card-bg) 0%, #15151c 100%);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--primary-yellow);
      border-radius: 12px;
      padding: 20px 25px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background-color: var(--primary-yellow);
      color: var(--primary-purple);
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: bold;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h1 {
      font-family: var(--font-title);
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--primary-yellow);
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Action Buttons Bar */
    .sync-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .sync-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
    }

    .sync-id-box {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: var(--primary-yellow);
      word-break: break-all;
    }

    .btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-yellow {
      background-color: var(--primary-yellow);
      color: #000;
    }

    .btn-yellow:hover {
      background-color: var(--yellow-hover);
      transform: translateY(-1px);
    }

    .btn-purple {
      background-color: var(--primary-purple);
      color: #fff;
    }

    .btn-purple:hover {
      background-color: var(--purple-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--input-bg);
      border-color: var(--text-muted);
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background-color: #bd2130;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
    }

    /* Search & Controls */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-yellow);
    }

    /* Category Tabs */
    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-purple) var(--bg-dark);
    }

    .cat-tab {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-tab.active {
      background-color: var(--primary-purple);
      color: #fff;
      border-color: var(--primary-purple);
    }

    .cat-tab:hover:not(.active) {
      border-color: var(--primary-yellow);
      color: var(--text-main);
    }

    /* Response Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: rgba(255, 203, 3, 0.4);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 18px;
      color: var(--primary-yellow);
      letter-spacing: 0.5px;
    }

    .card-tag {
      background-color: rgba(93, 39, 131, 0.3);
      color: #d1b3ff;
      border: 1px solid rgba(93, 39, 131, 0.5);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-body {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--primary-yellow);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 22px;
      color: var(--primary-yellow);
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary-yellow);
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--primary-yellow);
      color: #000;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      background: var(--card-bg);
      border: 1px border-dashed var(--border-color);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">T</div>
        <div class="brand-text">
          <h1>Tecnomas</h1>
          <p>Respuestas Rápidas Atención al Cliente</p>
        </div>
      </div>
      <div>
        <button class="btn btn-yellow" onclick="openAddModal()">➕ Nueva Respuesta</button>
      </div>
    </header>

    <!-- Cloud Sync Controls -->
    <div class="sync-bar">
      <div class="sync-info">
        <span>☁️ Sync ID:</span>
        <div class="sync-id-box" id="syncIdDisplay">No generado</div>
        <button class="btn btn-outline btn-sm" onclick="copySyncId()">📋 Copiar ID</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-yellow btn-sm" onclick="saveToCloud()">☁️ Guardar en Nube</button>
        <button class="btn btn-purple btn-sm" onclick="loadFromCloud()">📥 Cargar de Nube</button>
        <button class="btn btn-outline btn-sm" onclick="exportBackup()">💾 Backup TXT</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar por palabra clave o título..." oninput="renderCards()">
      <button class="btn btn-outline" onclick="openCategoriesModal()">🏷️ Categorías</button>
    </div>

    <!-- Category Filter Tabs -->
    <div class="categories-bar" id="categoryTabs"></div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- Modal: Agregar / Editar Respuesta -->
  <div class="modal-overlay" id="responseModal">
    <div class="modal">
      <div class="modal-title" id="modalResponseTitle">Nueva Respuesta</div>
      <form id="responseForm" onsubmit="handleSaveResponse(event)">
        <input type="hidden" id="respId">
        <div class="form-group">
          <label>Título de la Respuesta</label>
          <input type="text" id="respTitle" class="form-control" placeholder="Ej: Horarios de atención" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="respCategory" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>Contenido del Mensaje</label>
          <textarea id="respContent" class="form-control" placeholder="Escribe el texto que se copiará al portapapeles..." required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('responseModal')">Cancelar</button>
          <button type="submit" class="btn btn-yellow">Guardar Respuesta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Conectar Sync ID -->
  <div class="modal-overlay" id="syncModal">
    <div class="modal">
      <div class="modal-title">Cargar desde la Nube</div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">
        Ingresa tu Sync ID existente para descargar y sincronizar las respuestas en este dispositivo.
      </p>
      <div class="form-group">
        <label>Sync ID de Tecnomas</label>
        <input type="text" id="inputSyncId" class="form-control" placeholder="Ej: 65a123bc45de6789..." required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('syncModal')">Cancelar</button>
        <button type="button" class="btn btn-purple" onclick="confirmLoadFromCloud()">Cargar Datos</button>
      </div>
    </div>
  </div>

  <!-- Modal: Gestionar Categorías -->
  <div class="modal-overlay" id="categoriesModal">
    <div class="modal">
      <div class="modal-title">Gestionar Categorías</div>
      <div class="form-group">
        <label>Agregar Nueva Categoría</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="newCatInput" class="form-control" placeholder="Nombre de categoría...">
          <button type="button" class="btn btn-yellow" onclick="addCategory()">Agregar</button>
        </div>
      </div>
      <div class="form-group">
        <label>Categorías Existentes</label>
        <div id="catList" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('categoriesModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">¡Copiado al portapapeles!</div>

  <script>
    // Configuración API JsonStorage
    const JSONSTORAGE_API_KEY = "3ece9911-23ff-4eca-bb69-feaf41441344";
    
    // Datos iniciales por defecto de Tecnomas
    const defaultData = {
      categories: ["General", "Horarios", "Envíos", "Garantías", "Pagos"],
      responses: [
        {
          id: "1",
          title: "Horarios y Ubicación",
          category: "Horarios",
          content: "Hola! 👋 Atendemos de Lunes a Viernes de 9:00 a 18:00 hs. Nos encontramos en Av. Tecnomas 1234."
        },
        {
          id: "2",
          title: "Métodos de Pago",
          category: "Pagos",
          content: "Aceptamos efectivo, transferencias bancarias y tarjetas de crédito/débito en hasta 3 cuotas sin interés 💳."
        },
        {
          id: "3",
          title: "Envíos a Domicilio",
          category: "Envíos",
          content: "Realizamos envíos a todo el país a través de correo local. Envíos en el día dentro de la ciudad en compras antes de las 13 hs."
        }
      ]
    };

    // Estado global de la app
    let state = {
      categories: [],
      responses: [],
      activeCategory: "Todas",
      syncId: localStorage.getItem("tecnomas_sync_id") || ""
    };

    // Inicialización
    document.addEventListener("DOMContentLoaded", () => {
      loadLocalState();
      updateSyncDisplay();
      renderCategoryTabs();
      renderCards();
    });

    function loadLocalState() {
      const saved = localStorage.getItem("tecnomas_app_data");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.categories = parsed.categories || defaultData.categories;
          state.responses = parsed.responses || defaultData.responses;
        } catch (e) {
          state.categories = defaultData.categories;
          state.responses = defaultData.responses;
        }
      } else {
        state.categories = defaultData.categories;
        state.responses = defaultData.responses;
        saveLocalState();
      }
    }

    function saveLocalState() {
      localStorage.setItem("tecnomas_app_data", JSON.stringify({
        categories: state.categories,
        responses: state.responses
      }));
    }

    function updateSyncDisplay() {
      const display = document.getElementById("syncIdDisplay");
      display.textContent = state.syncId ? state.syncId : "No generado (Haz clic en Guardar)";
    }

    // --- Sincronización con JsonStorage.net API corregida ---

    async function saveToCloud() {
      showToast("Sincronizando con la nube...");
      
      const payload = {
        categories: state.categories,
        responses: state.responses
      };

      try {
        // Si hay un Sync ID guardado, intentamos actualizar con PUT
        if (state.syncId) {
          const putResponse = await fetch(`https://api.jsonstorage.net/v1/json/${state.syncId}?apiKey=${JSONSTORAGE_API_KEY}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          // Si da 404 (el ID ya no existe en el servidor), lo limpiamos y forzamos creación por POST abajo
          if (putResponse.status === 404) {
            state.syncId = "";
            localStorage.removeItem("tecnomas_sync_id");
          } else if (!putResponse.ok) {
            throw new Error(`HTTP Error: ${putResponse.status}`);
          } else {
            showToast("¡Actualizado en la nube con éxito!");
            return;
          }
        }

        // Si no hay Sync ID o falló por 404, creamos uno nuevo mediante POST
        const postResponse = await fetch(`https://api.jsonstorage.net/v1/json?apiKey=${JSONSTORAGE_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!postResponse.ok) throw new Error(`HTTP Error: ${postResponse.status}`);
        
        const result = await postResponse.json();
        // Extraer ID de la uri devuelta por jsonstorage.net
        let createdId = "";
        if (result.uri) {
          const parts = result.uri.split('/');
          createdId = parts[parts.length - 1];
        }
        if (!createdId) {
          createdId = result.id || result.objectId || "";
        }

        if (createdId) {
          state.syncId = createdId;
          localStorage.setItem("tecnomas_sync_id", createdId);
          updateSyncDisplay();
          showToast("¡Nuevo Sync ID generado y guardado!");
        } else {
          showToast("Guardado en la nube con éxito.");
        }

      } catch (err) {
        console.error("Cloud error:", err);
        alert("Error al guardar en la nube: " + err.message);
      }
    }

    function loadFromCloud() {
      document.getElementById("inputSyncId").value = state.syncId || "";
      openModal("syncModal");
    }

    async function confirmLoadFromCloud() {
      const inputId = document.getElementById("inputSyncId").value.trim();
      if (!inputId) {
        alert("Por favor ingresa un Sync ID válido.");
        return;
      }

      showToast("Cargando datos...");
      try {
        const response = await fetch(`https://api.jsonstorage.net/v1/json/${inputId}?apiKey=${JSONSTORAGE_API_KEY}`);
        
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const data = await response.json();

        if (data && data.responses && data.categories) {
          state.responses = data.responses;
          state.categories = data.categories;
          state.syncId = inputId;
          
          localStorage.setItem("tecnomas_sync_id", inputId);
          saveLocalState();
          
          updateSyncDisplay();
          renderCategoryTabs();
          renderCards();
          
          closeModal("syncModal");
          showToast("¡Datos cargados con éxito!");
        } else {
          alert("El formato de datos en ese Sync ID no es válido.");
        }
      } catch (err) {
        console.error("Load cloud error:", err);
        alert("Error al cargar datos. Verifica que el Sync ID sea correcto.");
      }
    }

    function copySyncId() {
      if (!state.syncId) {
        alert("Aún no tienes un Sync ID. Haz clic en 'Guardar en Nube' para generarlo.");
        return;
      }
      navigator.clipboard.writeText(state.syncId);
      showToast("¡Sync ID copiado!");
    }

    // --- Renderizado de UI ---

    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabs");
      const allCat = ["Todas", ...state.categories];
      
      container.innerHTML = allCat.map(cat => `
        <div class="cat-tab ${state.activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
          ${cat}
        </div>
      `).join("");
    }

    function selectCategory(cat) {
      state.activeCategory = cat;
      renderCategoryTabs();
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById("cardsGrid");
      const search = document.getElementById("searchInput").value.toLowerCase();

      let filtered = state.responses;

      if (state.activeCategory !== "Todas") {
        filtered = filtered.filter(r => r.category === state.activeCategory);
      }

      if (search) {
        filtered = filtered.filter(r => 
          r.title.toLowerCase().includes(search) || 
          r.content.toLowerCase().includes(search) ||
          r.category.toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No se encontraron respuestas para esta búsqueda.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <span class="card-tag">${escapeHtml(item.category)}</span>
          </div>
          <div class="card-body">${escapeHtml(item.content)}</div>
          <div class="card-actions">
            <div>
              <button class="btn btn-outline btn-sm" onclick="openEditModal('${item.id}')">✏️ Editar</button>
              <button class="btn btn-danger btn-sm" onclick="deleteResponse('${item.id}')">🗑️</button>
            </div>
            <button class="btn btn-yellow btn-sm" onclick="copyToClipboard(\`${escapeJsString(item.content)}\`)">📋 Copiar</button>
          </div>
        </div>
      `).join("");
    }

    // --- Operaciones CRUD ---

    function openAddModal() {
      document.getElementById("modalResponseTitle").textContent = "Nueva Respuesta";
      document.getElementById("respId").value = "";
      document.getElementById("respTitle").value = "";
      document.getElementById("respContent").value = "";
      
      populateCategorySelect();
      openModal("responseModal");
    }

    function openEditModal(id) {
      const resp = state.responses.find(r => r.id === id);
      if (!resp) return;

      document.getElementById("modalResponseTitle").textContent = "Editar Respuesta";
      document.getElementById("respId").value = resp.id;
      document.getElementById("respTitle").value = resp.title;
      document.getElementById("respContent").value = resp.content;

      populateCategorySelect(resp.category);
      openModal("responseModal");
    }

    function populateCategorySelect(selectedCat = "") {
      const select = document.getElementById("respCategory");
      select.innerHTML = state.categories.map(c => `
        <option value="${c}" ${c === selectedCat ? 'selected' : ''}>${c}</option>
      `).join("");
    }

    function handleSaveResponse(event) {
      event.preventDefault();
      const id = document.getElementById("respId").value;
      const title = document.getElementById("respTitle").value.trim();
      const category = document.getElementById("respCategory").value;
      const content = document.getElementById("respContent").value.trim();

      if (!title || !content) return;

      if (id) {
        const index = state.responses.findIndex(r => r.id === id);
        if (index !== -1) {
          state.responses[index] = { id, title, category, content };
        }
      } else {
        const newResp = {
          id: Date.now().toString(),
          title,
          category,
          content
        };
        state.responses.push(newResp);
      }

      saveLocalState();
      renderCards();
      closeModal("responseModal");
      showToast("Respuesta guardada localmente");
    }

    function deleteResponse(id) {
      if (confirm("¿Estás seguro de que deseas eliminar esta respuesta?")) {
        state.responses = state.responses.filter(r => r.id !== id);
        saveLocalState();
        renderCards();
        showToast("Respuesta eliminada");
      }
    }

    // --- Categorías ---

    function openCategoriesModal() {
      renderCategoriesList();
      openModal("categoriesModal");
    }

    function renderCategoriesList() {
      const list = document.getElementById("catList");
      list.innerHTML = state.categories.map(c => `
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); padding: 8px 12px; border-radius: 6px;">
          <span style="font-size: 13px;">${escapeHtml(c)}</span>
          <button class="btn btn-danger btn-sm" onclick="removeCategory('${escapeJsString(c)}')">Eliminar</button>
        </div>
      `).join("");
    }

    function addCategory() {
      const input = document.getElementById("newCatInput");
      const name = input.value.trim();
      if (name && !state.categories.includes(name)) {
        state.categories.push(name);
        input.value = "";
        saveLocalState();
        renderCategoryTabs();
        renderCategoriesList();
      }
    }

    function removeCategory(catName) {
      if (state.categories.length <= 1) {
        alert("Debes mantener al menos una categoría.");
        return;
      }
      if (confirm(`¿Eliminar la categoría "${catName}"? Las respuestas pasarán a la primera categoría disponible.`)) {
        state.categories = state.categories.filter(c => c !== catName);
        const fallbackCat = state.categories[0];
        state.responses.forEach(r => {
          if (r.category === catName) r.category = fallbackCat;
        });
        if (state.activeCategory === catName) state.activeCategory = "Todas";
        saveLocalState();
        renderCategoryTabs();
        renderCards();
        renderCategoriesList();
      }
    }

    // --- Utilidades ---

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("¡Copiado al portapapeles!");
      }).catch(err => {
        console.error("Error al copiar: ", err);
      });
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        categories: state.categories,
        responses: state.responses
      }, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `tecnomas_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeJsString(str) {
      return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }
  </script>
</body>
</html>
